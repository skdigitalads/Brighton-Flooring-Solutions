<style id="bfs-enhancements">
html{scroll-behavior:smooth}
#projects .card-shadow,section .card-shadow{box-shadow:0 14px 34px rgba(11,29,58,.10);transition:transform .35s ease,box-shadow .35s ease}
section{scroll-margin-top:80px}
/* Projects: React-safe horizontal carousel via CSS only */
#projects .grid{display:flex!important;overflow-x:auto!important;scroll-snap-type:x mandatory!important;scrollbar-width:thin;padding-bottom:10px;gap:18px!important}
#projects .grid>*{flex:0 0 86%!important;scroll-snap-align:start!important;max-width:86%}
@media(min-width:640px){#projects .grid>*{flex-basis:48%!important;max-width:48%}}
@media(min-width:1024px){#projects .grid>*{flex-basis:32%!important;max-width:32%}}
#projects .grid>*:hover{transform:translateY(-4px)}
/* ============ STICKY HEADER ============ */
/* The header's own top uses var(--safe-area-inset-top), which is never defined, so top became invalid and the header scrolled away. Pin it to the viewport top. */
#root header{position:sticky!important;top:0!important;z-index:40!important}
/* ============ HEADER: TAGLINE FULLY VISIBLE + NAV ONE LINE ============ */
/* Header row grows if the tagline needs 2 lines on small screens */
#root header>div[class*="max-w-[1180px]"]{height:auto!important;min-height:72px!important;padding-top:10px!important;padding-bottom:10px!important}
/* Company name: never truncate */
#root header span[class*="text-[17px]"]{white-space:nowrap!important;overflow:visible!important;text-overflow:clip!important;font-size:16px!important}
/* Tagline: never truncate, visible on mobile too, wraps cleanly instead of cutting off */
#root header span[class*="tracking-widest"]{display:block!important;white-space:normal!important;overflow:visible!important;text-overflow:clip!important;font-size:10px!important;letter-spacing:.04em!important;line-height:1.35!important;max-width:360px!important}
@media(max-width:640px){
  #root header span[class*="text-[17px]"]{font-size:15px!important}
  #root header span[class*="tracking-widest"]{font-size:9px!important;max-width:230px!important}
}
/* Nav: every link on one line, tighter gaps so nothing wraps to 2-3 lines */
#root header nav{gap:16px!important;font-size:13px!important}
#root header nav a{white-space:nowrap!important}
#root header a[href^="tel:"]{white-space:nowrap!important}
#root header button{white-space:nowrap!important}
/* ============ HERO CONTACT ROW: EVEN, ONE LINE ============ */
.bfs-hero-contact{flex-wrap:wrap!important}
@media(max-width:640px){
  .bfs-hero-contact{font-size:11px!important;gap:6px 12px!important;justify-content:space-between!important}
  .bfs-hero-contact>span{white-space:nowrap!important}
  .bfs-hero-contact>span:nth-child(3){flex-basis:100%!important;justify-content:center!important}
}
/* ============ REFERENCE-STYLE ADMIN ============ */
.bfs-admin-panel{position:fixed!important;top:0!important;bottom:0!important;right:0!important;left:auto!important;width:var(--bfs-admin-w,42%)!important;min-width:380px!important;max-width:none!important;z-index:90!important;background:#F3EBD8!important;border-left:4px solid #C9A227!important;border-top:0!important;border-right:0!important;border-bottom:0!important;border-radius:0!important;box-shadow:-20px 0 40px rgba(0,0,0,.18)!important;overflow:hidden!important}
.bfs-admin-panel.bfs-admin-full{width:100%!important;min-width:0!important;border-left:0!important}
.bfs-admin-panel .bfs-admin-body{flex:1;min-height:0;display:flex;flex-direction:column}
.bfs-admin-header{background:#6B0F1A!important;color:#fff!important;flex-wrap:wrap!important;row-gap:8px!important}
.bfs-admin-header{height:auto!important;min-height:62px!important;padding-top:10px!important;padding-bottom:10px!important}
.bfs-admin-header .bfs-admin-title{font-weight:800!important;font-size:15px!important;line-height:1.1!important}
.bfs-admin-header .bfs-admin-sub{font-size:11px!important;color:#FFD95E!important;font-weight:600!important;display:block!important}
.bfs-admin-monogram{width:36px!important;height:36px!important;flex:0 0 auto!important;border-radius:999px!important;border:1px solid #D4AF37!important;display:grid!important;place-items:center!important;font-weight:800!important;color:#FFD95E!important;font-size:13px!important;background:transparent!important}
.bfs-admin-panel .field{width:100%!important;background:#fff!important;border:1px solid #D8CFC2!important;border-radius:8px!important;padding:9px 11px!important;font-size:14px!important;color:#2B1A12!important;outline:none!important;box-shadow:none!important}
.bfs-admin-panel .field:focus{border-color:#C9A227!important;box-shadow:0 0 0 3px rgba(201,162,39,.18)!important}
.bfs-admin-panel .label{font-size:11px!important;letter-spacing:.08em!important;text-transform:uppercase!important;color:#7A5A2A!important;font-weight:700!important;margin-bottom:5px!important;display:block!important}
.bfs-admin-panel aside{background:#fff!important;border-right:1px solid #E5C76B!important;width:220px!important;flex-shrink:0!important}
.bfs-admin-panel aside .bfs-modules-label{padding:8px!important;font-size:11px!important;letter-spacing:.12em!important;font-weight:700!important;color:#8A6A1A!important;text-transform:uppercase!important}
.bfs-admin-panel aside button.bfs-module-btn{border-radius:12px!important}
.bfs-admin-panel aside button.bfs-module-btn.bfs-module-active{background:#6B0F1A!important;color:#fff!important}
.bfs-admin-panel aside button.bfs-module-btn:not(.bfs-module-active):hover{background:#FFF3D6!important}
.bfs-mobile-modules{display:none;flex:none!important;height:52px!important;align-items:center!important}
.bfs-mobile-modules button{height:36px!important;flex:none!important;align-self:center!important}
@media(max-width:900px){
  .bfs-admin-panel{left:0!important;right:0!important;top:auto!important;width:100%!important;min-width:0!important;height:var(--bfs-admin-h,62vh)!important;border-left:0!important;border-top:4px solid #C9A227!important}
  .bfs-admin-panel.bfs-admin-full{height:100dvh!important}
  .bfs-admin-panel aside{display:none!important}
  .bfs-mobile-modules{display:flex!important;gap:8px!important;overflow-x:auto!important;padding:12px!important;background:#fff!important;border-bottom:1px solid #E5C76B!important;position:sticky!important;top:0!important;z-index:5!important}
  .bfs-mobile-modules button{white-space:nowrap!important;padding:8px 12px!important;border-radius:999px!important;font-size:12px!important;font-weight:700!important;border:1px solid #D8CFC2!important;background:#fff!important;color:#2B1A12!important}
  .bfs-mobile-modules button.bfs-module-active{background:#6B0F1A!important;color:#fff!important;border-color:#6B0F1A!important}
  #bfs-preview-banner{display:none!important}
  #bfs-drag-handle{left:0!important;right:0!important;top:auto!important;bottom:var(--bfs-admin-h,62vh)!important;width:100%!important;height:26px!important;cursor:row-resize!important;flex-direction:row!important}
}
#bfs-drag-handle{position:fixed!important;top:0!important;bottom:0!important;width:12px!important;z-index:95!important;background:#E5C76B!important;color:#6B0F1A!important;cursor:col-resize!important;display:flex!important;align-items:center!important;justify-content:center!important;font-weight:800!important;font-size:18px!important;user-select:none!important;touch-action:none!important}
#bfs-drag-handle.bfs-hidden{display:none!important}
#bfs-preview-banner{position:fixed!important;top:0!important;left:0!important;z-index:80!important;background:#FFF3D6!important;border-bottom:1px solid #E5C76B!important;color:#6B0F1A!important;text-align:center!important;font-size:12px!important;font-weight:700!important;padding:8px 12px!important}
#bfs-preview-banner.bfs-paused{background:#FDE68A!important}
#bfs-preview-banner.bfs-hidden{display:none!important}
body.bfs-admin-open #root header{margin-top:32px!important;top:32px!important}
body.bfs-live-paused #root>*:not(.bfs-admin-panel){opacity:.55!important;pointer-events:none!important}
.bfs-layout-group{display:flex!important;background:rgba(0,0,0,.25)!important;border-radius:999px!important;padding:4px!important;font-size:12px!important;font-weight:700!important}
.bfs-layout-group button{padding:6px 12px!important;border-radius:999px!important;color:#fff!important;background:transparent!important;border:0!important;cursor:pointer!important;font-weight:700!important}
.bfs-layout-group button.bfs-on{background:#fff!important;color:#6B0F1A!important}
.bfs-hdr-btn{border:1px solid rgba(255,255,255,.4)!important;padding:6px 14px!important;border-radius:999px!important;font-size:12px!important;font-weight:700!important;color:#fff!important;background:transparent!important;cursor:pointer!important;white-space:nowrap!important}
.bfs-hdr-btn.bfs-white{background:#fff!important;color:#6B0F1A!important;border-color:#fff!important}
.bfs-hdr-close{background:rgba(255,255,255,.15)!important;border:0!important;padding:8px 12px!important;border-radius:999px!important;font-size:12px!important;font-weight:700!important;color:#fff!important;cursor:pointer!important}
.bfs-login-card{background:#FFF8E7!important;border-radius:20px!important}
.bfs-login-monogram{width:44px!important;height:44px!important;border-radius:999px!important;background:#6B0F1A!important;color:#FFD95E!important;display:grid!important;place-items:center!important;font-weight:800!important}
.bfs-login-btn{background:#6B0F1A!important}
#bfs-autosave-note{margin-top:24px!important;font-size:13px!important;font-weight:700!important;color:#1E5A2E!important;background:#EAF6EC!important;border:1px solid #BFE3C6!important;border-radius:999px!important;padding:8px 16px!important;display:inline-block!important}
#bfs-autosave-sub{font-size:12px!important;color:#8A7A6A!important;margin-top:8px!important}
@media(max-width:900px){#bfs-drag-handle{left:0!important;right:0!important;top:auto!important;bottom:var(--bfs-admin-h,62vh)!important;width:100%!important;height:26px!important;cursor:row-resize!important;flex-direction:row!important}}
</style>
<script>
(function(){
  // Tag the hero contact row so CSS can align it evenly
  function tagHeroContact(){
    var spans = document.querySelectorAll('span');
    for (var i = 0; i < spans.length; i++) {
      if (spans[i].textContent.indexOf('Ramapuram, Chennai') > -1 && spans[i].parentElement && spans[i].parentElement.tagName === 'DIV') {
        spans[i].parentElement.classList.add('bfs-hero-contact');
      }
    }
  }
  var LS = { layout: 'bfs_admin_layout', w: 'bfs_admin_w', h: 'bfs_admin_h', live: 'bfs_live_preview' };
  function getLS(k, d){ try { var v = localStorage.getItem(k); return v === null ? d : v; } catch(e){ return d; } }
  function setLS(k, v){ try { localStorage.setItem(k, v); } catch(e){} }
  var layout = getLS(LS.layout, 'split');
  var adminW = parseFloat(getLS(LS.w, '42')) || 42;
  var adminH = parseFloat(getLS(LS.h, '62')) || 62;
  var liveOn = getLS(LS.live, 'on') === 'on';
  function applyVars(){
    document.documentElement.style.setProperty('--bfs-admin-w', adminW + '%');
    document.documentElement.style.setProperty('--bfs-admin-h', adminH + 'vh');
    document.body.classList.toggle('bfs-live-paused', !liveOn);
  }
  function findAdminPanel(){
    var all = document.querySelectorAll('div');
    for (var i = 0; i < all.length; i++) {
      var c = all[i].className || '';
      if (typeof c === 'string' && c.indexOf('z-[80]') > -1 && c.indexOf('fixed inset-0') > -1) return all[i];
    }
    return null;
  }
  function isLogin(panel){ var t = panel.innerText || ''; return t.indexOf('Admin Login') > -1 || t.indexOf('Create Admin Password') > -1; }
  function restyleLogin(panel){
    var card = panel.querySelector('div.bg-white.w-full.max-w-\\[440px\\]') || panel.querySelector('div.max-w-\\[440px\\]');
    if (card && !card.classList.contains('bfs-login-card')) card.classList.add('bfs-login-card');
    var h2s = panel.querySelectorAll('h2');
    for (var i = 0; i < h2s.length; i++) {
      if (h2s[i].textContent.trim() === 'Admin Login') { h2s[i].textContent = 'Enter Admin Password'; }
    }
    var ps = panel.querySelectorAll('p');
    for (var j = 0; j < ps.length; j++) {
      if (ps[j].textContent.indexOf('Enter your admin password to manage') > -1) ps[j].textContent = 'Enter your password to open the dashboard.';
    }
    var mono = panel.querySelector('div.w-12.h-12');
    if (mono && !mono.classList.contains('bfs-login-monogram')) { mono.className = 'bfs-login-monogram'; mono.textContent = 'BFS'; }
    var btns = panel.querySelectorAll('button');
    for (var k = 0; k < btns.length; k++) {
      var bt = (btns[k].textContent || '').trim();
      if (bt === 'Login' || bt === 'Create Password & Enter Admin') btns[k].classList.add('bfs-login-btn');
    }
  }
  function restyleHeader(panel){
    var header = null;
    var divs = panel.querySelectorAll('div');
    for (var i = 0; i < divs.length; i++) {
      var c = divs[i].className || '';
      if (typeof c === 'string' && c.indexOf('h-[62px]') > -1 && c.indexOf('bg-[#0B1D3A]') > -1) { header = divs[i]; break; }
    }
    if (!header) return;
    header.classList.add('bfs-admin-header');
    header.classList.remove('bg-[#0B1D3A]');
    if (!header.querySelector('.bfs-admin-monogram')) {
      var mono = document.createElement('span'); mono.className = 'bfs-admin-monogram'; mono.textContent = 'BFS';
      var first = header.firstElementChild; if (first) first.insertBefore(mono, first.firstChild);
    }
    var b = header.querySelector('b');
    if (b && b.textContent.trim() === 'Admin Panel') {
      b.textContent = 'Admin Dashboard';
      b.className = 'bfs-admin-title';
      var sub = document.createElement('span'); sub.className = 'bfs-admin-sub'; sub.textContent = 'Brighton Flooring Solutions \u2022 Auto-save on';
      b.parentNode.appendChild(sub);
    }
    var spans = header.querySelectorAll('span');
    for (var s = 0; s < spans.length; s++) {
      var sc = spans[s].className || '';
      if (typeof sc === 'string' && sc.indexOf('bg-white/10') > -1 && sc.indexOf('rounded-full') > -1) {
        spans[s].style.background = 'rgba(0,0,0,.25)'; spans[s].style.color = '#fff';
      }
    }
    var btns = header.querySelectorAll('button');
    for (var k = 0; k < btns.length; k++) {
      var bt = (btns[k].textContent || '').trim();
      if (bt === 'Live Preview') { btns[k].textContent = 'Preview Public Site'; btns[k].classList.add('bfs-hdr-btn','bfs-white'); }
      if (bt === 'Exit Admin') { btns[k].textContent = 'Back to Website'; btns[k].classList.add('bfs-hdr-btn'); }
      if (bt === 'Logout') btns[k].classList.add('bfs-hdr-btn');
    }
    if (!header.querySelector('#bfs-layout-group')) {
      var grp = document.createElement('div'); grp.id = 'bfs-layout-group'; grp.className = 'bfs-layout-group';
      grp.setAttribute('role','group'); grp.setAttribute('aria-label','Admin layout');
      var b1 = document.createElement('button'); b1.textContent = 'Docked Right';
      var b2 = document.createElement('button'); b2.textContent = 'Expand Full';
      function paint(){ b1.classList.toggle('bfs-on', layout === 'split'); b2.classList.toggle('bfs-on', layout === 'full'); }
      b1.onclick = function(){ layout = 'split'; setLS(LS.layout,'split'); paint(); syncPanel(); };
      b2.onclick = function(){ layout = 'full'; setLS(LS.layout,'full'); paint(); syncPanel(); };
      grp.appendChild(b1); grp.appendChild(b2); paint();
      header.appendChild(grp);
      var liveBtn = document.createElement('button'); liveBtn.id = 'bfs-live-btn'; liveBtn.className = 'bfs-hdr-btn';
      function paintLive(){ liveBtn.textContent = 'Live Preview: ' + (liveOn ? 'ON' : 'OFF'); }
      liveBtn.onclick = function(){ liveOn = !liveOn; setLS(LS.live, liveOn ? 'on' : 'off'); paintLive(); applyVars(); syncBanner(); };
      paintLive(); header.appendChild(liveBtn);
      var closeBtn = document.createElement('button'); closeBtn.className = 'bfs-hdr-close'; closeBtn.textContent = 'Close \u00d7';
      closeBtn.setAttribute('aria-label','Close dashboard');
      closeBtn.onclick = function(){
        var all = header.querySelectorAll('button');
        for (var q = 0; q < all.length; q++) { if ((all[q].textContent || '').trim() === 'Back to Website') { all[q].click(); return; } }
      };
      header.appendChild(closeBtn);
    }
  }
  function restyleSidebar(panel){
    var asides = panel.querySelectorAll('aside');
    if (!asides.length) return;
    var aside = asides[0];
    var btns = aside.querySelectorAll('button');
    var label = aside.querySelector('p');
    if (label && label.textContent.indexOf('Manage Website') > -1) {
      label.textContent = btns.length + ' MODULES'; label.className = 'bfs-modules-label';
    }
    for (var i = 0; i < btns.length; i++) {
      btns[i].classList.add('bfs-module-btn');
      var c = btns[i].className || '';
      btns[i].classList.toggle('bfs-module-active', c.indexOf('bg-[#0B1D3A]') > -1);
    }
    if (!panel.querySelector('.bfs-mobile-modules')) {
      var chips = document.createElement('div'); chips.className = 'bfs-mobile-modules';
      var names = [];
      for (var j = 0; j < btns.length; j++) names.push(btns[j].textContent.trim());
      var activeText = '';
      var mainH2 = panel.querySelector('main h2'); if (mainH2) activeText = mainH2.textContent.trim();
      names.forEach(function(n){
        var b = document.createElement('button'); b.textContent = n;
        if (n === activeText) b.classList.add('bfs-module-active');
        b.onclick = function(){
          for (var q = 0; q < btns.length; q++) { if (btns[q].textContent.trim() === n) { btns[q].click(); return; } }
        };
        chips.appendChild(b);
      });
      var main = panel.querySelector('main'); if (main) main.parentNode.insertBefore(chips, main);
    }
  }
  function ensureChrome(){
    if (!document.getElementById('bfs-drag-handle')) {
      var h = document.createElement('div'); h.id = 'bfs-drag-handle'; h.title = 'Drag to resize admin panel'; h.setAttribute('aria-label','Drag to resize admin panel');
      h.innerHTML = '<span>\u22ee</span>';
      h.addEventListener('pointerdown', function(e){
        e.preventDefault();
        var startX = e.clientX, startY = e.clientY, startW = adminW, startH = adminH, isMobile = window.innerWidth < 900;
        function move(ev){
          if (isMobile) { adminH = Math.max(30, Math.min(92, startH + (startY - ev.clientY) / window.innerHeight * 100)); setLS(LS.h, String(adminH)); }
          else { adminW = Math.max(32, Math.min(65, startW + (startX - ev.clientX) / window.innerWidth * 100)); setLS(LS.w, String(adminW)); }
          applyVars(); syncPanel();
        }
        function up(){ window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); }
        window.addEventListener('pointermove', move); window.addEventListener('pointerup', up);
      });
      document.body.appendChild(h);
    }
    if (!document.getElementById('bfs-preview-banner')) {
      var bn = document.createElement('div'); bn.id = 'bfs-preview-banner';
      document.body.appendChild(bn);
    }
    syncPanel(); syncBanner();
  }
  function syncPanel(){
    var panel = findAdminPanel(); if (!panel) return;
    panel.classList.toggle('bfs-admin-full', layout === 'full');
    var handle = document.getElementById('bfs-drag-handle'); if (handle) handle.classList.toggle('bfs-hidden', layout === 'full');
    var banner = document.getElementById('bfs-preview-banner'); if (banner) banner.classList.toggle('bfs-hidden', layout === 'full');
    if (layout === 'split') {
      if (window.innerWidth < 900) { handle.style.left = ''; handle.style.right = ''; handle.style.bottom = ''; handle.style.top = ''; }
      else { handle.style.left = 'auto'; handle.style.right = adminW + '%'; handle.style.bottom = '0'; handle.style.top = '0'; }
    }
    var main = panel.querySelector('main');
    if (main && !main.querySelector('#bfs-autosave-note')) {
      var note = document.createElement('p'); note.id = 'bfs-autosave-note'; note.textContent = 'Saved \u2713 \u2014 no Save button needed.';
      var sub = document.createElement('p'); sub.id = 'bfs-autosave-sub'; sub.textContent = 'Edits auto-save in this browser. Export JSON / HTML for backup.';
      main.appendChild(note); main.appendChild(sub);
    }
  }
  function syncBanner(){
    var banner = document.getElementById('bfs-preview-banner'); if (!banner) return;
    var newText;
    if (!liveOn) {
      newText = 'Live Preview paused \u2014 turn Live Preview ON in the admin top bar to resume live updates.';
      banner.classList.add('bfs-paused');
    } else {
      newText = 'Website preview \u2014 live & clickable \u2022 Admin is on the right';
      banner.classList.remove('bfs-paused');
    }
    if (banner.textContent !== newText) banner.textContent = newText;
    banner.style.width = 'calc(100% - ' + adminW + '%)';
  }
  function tick(){
    try { obs.disconnect(); } catch(e){}
    tagHeroContact();
    var panel = findAdminPanel();
    var banner = document.getElementById('bfs-preview-banner');
    var handle = document.getElementById('bfs-drag-handle');
    if (!panel) {
      document.body.classList.remove('bfs-admin-open');
      if (banner) banner.classList.add('bfs-hidden');
      if (handle) handle.classList.add('bfs-hidden');
      try { obs.observe(document.documentElement, { childList: true, subtree: true, characterData: true }); } catch(e){}
      return;
    }
    if (isLogin(panel)) {
      panel.classList.remove('bfs-admin-panel','bfs-admin-full');
      document.body.classList.remove('bfs-admin-open');
      if (banner) banner.classList.add('bfs-hidden');
      if (handle) handle.classList.add('bfs-hidden');
      restyleLogin(panel);
      try { obs.observe(document.documentElement, { childList: true, subtree: true, characterData: true }); } catch(e){}
      return;
    }
    panel.classList.add('bfs-admin-panel');
    document.body.classList.add('bfs-admin-open');
    restyleHeader(panel);
    restyleSidebar(panel);
    ensureChrome();
    try { obs.observe(document.documentElement, { childList: true, subtree: true, characterData: true }); } catch(e){}
  }
  // Ctrl+Shift+A opens admin via React's own Ctrl+Shift+E handler (footer Admin button no longer exists)
  document.addEventListener('keydown', function(e){
    if (e.ctrlKey && e.shiftKey && e.key && e.key.toLowerCase() === 'a') {
      var t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      e.preventDefault();
      window.dispatchEvent(new KeyboardEvent('keydown', { key: 'E', code: 'KeyE', ctrlKey: true, shiftKey: true, bubbles: true, cancelable: true }));
    }
  });
  applyVars();
  var obs = new MutationObserver(function(){ tick(); });
  obs.observe(document.documentElement, { childList: true, subtree: true, characterData: true });
  document.addEventListener('DOMContentLoaded', tick);
  setTimeout(tick, 300); setTimeout(tick, 1200);
  window.addEventListener('resize', function(){ syncPanel(); syncBanner(); });
})();
</script>
</body>
</html>
